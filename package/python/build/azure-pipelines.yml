trigger:
  branches:
    include:
      - main
  paths:
    include:
      - package/python/build/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - package/python/build/**

variables:
  BUILD_PATH: "package/python/build"

  PYTHON_VERSION: "3.15.2"
  PACKAGE_REVISION: "dbca1"
  PACKAGE_NAME: "python3.15-dbca"

  # Replace this with the official SHA256 checksum for:
  # Python-3.15.2.tgz
  #
  # The pipeline deliberately fails if this hasn't been configured.
  PYTHON_SHA256: "REPLACE_WITH_PYTHON_3_15_2_SHA256"


pool:
  vmImage: ubuntu-latest


resources:
  containers:
    - container: pythonbuilder
      image: ghcr.io/dbca-wa/docker-apps-dev:ubuntu_2604_base_python
      options: --user 0:0

pool:
  vmImage: ubuntu-latest  


steps:

  #
  # Checkout repository
  #
  - checkout: self
    clean: true
    fetchDepth: 1


  #
  # Set executable permissions.
  #
  # This is particularly useful when the files have been created
  # using the GitHub web interface where executable permissions
  # may not have been committed.
  #

  - bash: |
      set -euxo pipefail
  
      echo "=== Identity ==="
      whoami
      id
  
      echo "=== passwd ==="
      getent passwd "$(id -u)" || true
      getent passwd root || true
      getent passwd runner_azpcontainer || true
  
      echo "=== sudo ==="
      command -v sudo || true
  
      echo "=== apt directories ==="
      ls -ld \
        /var/lib/apt \
        /var/lib/apt/lists \
        /var/cache/apt \
        /var/cache/apt/archives
  
      echo "=== environment ==="
      echo "HOME=$HOME"
      echo "USER=${USER:-}"
      echo "LOGNAME=${LOGNAME:-}"
  
    displayName: Diagnose Azure container user
  
  - bash: |
      set -euxo pipefail
  
      whoami
      id
  
      if command -v sudo >/dev/null 2>&1; then
        sudo -n id
      fi
  
    displayName: Check privilege escalation
  
  - bash: |
      set -euxo pipefail

      chmod 0755 "$(BUILD_PATH)/packaging/build-deb.sh"
      chmod 0755 "$(BUILD_PATH)/packaging/debian/rules"
      chmod 0755 "$(BUILD_PATH)/packaging/debian/postinst"
      chmod 0755 "$(BUILD_PATH)/packaging/debian/postrm"

      echo "Packaging directory:"
      ls -la "$(BUILD_PATH)/packaging"

      echo
      echo "Debian directory:"
      ls -la "$(BUILD_PATH)/packaging/debian"

    displayName: Set packaging permissions


  #
  # Install packages required to compile CPython and
  # construct the Debian package.
  #
  - bash: |
      set -euxo pipefail
      
      whoami
      
      apt-get update

      DEBIAN_FRONTEND=noninteractive apt-get install -y \
        build-essential \
        ca-certificates \
        curl \
        debhelper \
        devscripts \
        dpkg-dev \
        fakeroot \
        file \
        gcc \
        g++ \
        libbz2-dev \
        libdb-dev \
        libexpat1-dev \
        libffi-dev \
        libgdbm-dev \
        liblzma-dev \
        libncurses-dev \
        libreadline-dev \
        libsqlite3-dev \
        libssl-dev \
        libtirpc-dev \
        libuuid1 \
        pkg-config \
        tk-dev \
        uuid-dev \
        xz-utils \
        zlib1g-dev

      rm -rf /var/lib/apt/lists/*

    displayName: Install package build dependencies


  #
  # Compile CPython and create the Debian package.
  #
  - bash: |
      set -euxo pipefail

      if [ "$(PYTHON_SHA256)" = "REPLACE_WITH_PYTHON_3_15_2_SHA256" ]; then
        echo "##vso[task.logissue type=error]PYTHON_SHA256 has not been configured."
        echo "Set PYTHON_SHA256 to the official SHA256 for Python-$(PYTHON_VERSION).tgz."
        exit 1
      fi

      "$(BUILD_PATH)/packaging/build-deb.sh" \
        "$(PYTHON_VERSION)" \
        "$(PACKAGE_REVISION)" \
        "$(PYTHON_SHA256)"

    displayName: Compile Python and build Debian package

    env:
      DEB_BUILD_OPTIONS: "parallel=$(nproc)"


  #
  # Display the packages generated by the build.
  #
  - bash: |
      set -euxo pipefail

      echo "Generated files:"

      find "$(Build.SourcesDirectory)/$(BUILD_PATH)/dist" \
        -maxdepth 1 \
        -type f \
        -exec ls -lh {} \;

    displayName: Display generated package files


  #
  # Copy Debian package and associated build metadata
  # into the Azure DevOps artifact staging directory.
  #
  - bash: |
      set -euxo pipefail

      ARTIFACT_DIR="$(Build.ArtifactStagingDirectory)/python-deb"

      mkdir -p "${ARTIFACT_DIR}"

      find "$(Build.SourcesDirectory)/$(BUILD_PATH)/dist" \
        -maxdepth 1 \
        -type f \
        -exec cp -v {} "${ARTIFACT_DIR}/" \;

      cd "${ARTIFACT_DIR}"

      #
      # Regenerate checksums for the final published Debian packages.
      #
      rm -f SHA256SUMS

      sha256sum ./*.deb > SHA256SUMS

      echo
      echo "Files to be published:"
      ls -lah

      echo
      echo "SHA256 checksums:"
      cat SHA256SUMS

    displayName: Stage Debian package


  #
  # Publish the package as an Azure DevOps Pipeline Artifact.
  #
  - task: PublishPipelineArtifact@1
    displayName: Publish Python Debian package

    inputs:
      targetPath: "$(Build.ArtifactStagingDirectory)/python-deb"
      artifact: "python-3.15-debian-package"
      publishLocation: "pipeline"
