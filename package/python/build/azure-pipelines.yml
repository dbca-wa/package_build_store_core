trigger:
  branches:
    include:
      - main
  paths:
    include:
      - package/python/build/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - package/python/build/**

variables:
  BUILD_PATH: "package/python/build"
  PYTHON_VERSION: "3.15.2"
  PACKAGE_REVISION: "dbca1"
  PACKAGE_NAME: "python3.15-dbca"
  BUILD_IMAGE: "ghcr.io/dbca-wa/docker-apps-dev:ubuntu_2604_base_python"

pool:
  vmImage: ubuntu-latest

steps:

  #
  # Checkout repository onto the Azure build agent.
  #
  - checkout: self
    clean: true
    fetchDepth: 1

  #
  # Display the host build environment.
  #
  - bash: |
      set -euxo pipefail

      echo "Azure build agent:"
      whoami
      id

      echo
      echo "Docker:"
      docker version

      echo
      echo "Build source directory:"
      echo "$(Build.SourcesDirectory)"

    displayName: Display build environment

  #
  # Pull the DBCA Ubuntu 26.04 Python build image.
  #
  - bash: |
      set -euxo pipefail

      docker pull "$(BUILD_IMAGE)"

    displayName: Pull Python build image

  #
  # Build the Python Debian package.
  #
  # Docker is invoked directly so that the package build container
  # can explicitly execute as root.
  #
  - bash: |
      set -euxo pipefail

      rm -rf "$(Build.SourcesDirectory)/$(BUILD_PATH)/dist"
      mkdir -p "$(Build.SourcesDirectory)/$(BUILD_PATH)/dist"

      echo "Starting build container:"
      echo "$(BUILD_IMAGE)"

      docker run --rm \
        --user 0:0 \
        --volume "$(Build.SourcesDirectory):/workspace" \
        --workdir /workspace \
        --env PYTHON_VERSION \
        --env PACKAGE_REVISION \
        "$(BUILD_IMAGE)" \
        bash -c '
          set -euxo pipefail

          echo "========================================"
          echo "Container identity"
          echo "========================================"

          whoami
          id

          if [ "$(id -u)" -ne 0 ]; then
              echo "ERROR: Build container is not running as root."
              exit 1
          fi

          echo
          echo "========================================"
          echo "Build parameters"
          echo "========================================"

          echo "Python version: ${PYTHON_VERSION}"
          echo "Package revision: ${PACKAGE_REVISION}"

          echo
          echo "========================================"
          echo "Operating system"
          echo "========================================"

          cat /etc/os-release

          echo
          echo "========================================"
          echo "Install Debian build dependencies"
          echo "========================================"

          apt-get update

          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            debhelper \
            devscripts \
            dpkg-dev \
            fakeroot \
            file \
            gcc \
            g++ \
            libbz2-dev \
            libdb-dev \
            libexpat1-dev \
            libffi-dev \
            libgdbm-dev \
            liblzma-dev \
            libncurses-dev \
            libreadline-dev \
            libsqlite3-dev \
            libssl-dev \
            libtirpc-dev \
            libuuid1 \
            pkg-config \
            tk-dev \
            uuid-dev \
            xz-utils \
            zlib1g-dev

          echo
          echo "========================================"
          echo "Set packaging permissions"
          echo "========================================"

          chmod 0755 \
            package/python/build/packaging/build-deb.sh \
            package/python/build/packaging/debian/rules \
            package/python/build/packaging/debian/postinst \
            package/python/build/packaging/debian/postrm

          ls -la package/python/build/packaging
          ls -la package/python/build/packaging/debian

          echo
          echo "========================================"
          echo "Verify build tools"
          echo "========================================"

          gcc --version
          g++ --version
          make --version
          dpkg-buildpackage --version
          dpkg-deb --version

          echo
          echo "========================================"
          echo "Build Python Debian package"
          echo "========================================"

          package/python/build/packaging/build-deb.sh \
            "${PYTHON_VERSION}" \
            "${PACKAGE_REVISION}"

          echo
          echo "========================================"
          echo "Generated files"
          echo "========================================"

          find package/python/build/dist \
            -maxdepth 1 \
            -type f \
            -exec ls -lh {} \;

          echo
          echo "========================================"
          echo "Build completed"
          echo "========================================"
        '

    displayName: Compile Python and build Debian package

    env:
      PYTHON_VERSION: $(PYTHON_VERSION)
      PACKAGE_REVISION: $(PACKAGE_REVISION)

  #
  # Verify that at least one Debian package has been produced.
  #
  - bash: |
      set -euxo pipefail

      DIST_DIR="$(Build.SourcesDirectory)/$(BUILD_PATH)/dist"

      echo "========================================"
      echo "Generated build output"
      echo "========================================"

      ls -lah "${DIST_DIR}"

      echo
      echo "Debian packages:"

      find "${DIST_DIR}" \
        -maxdepth 1 \
        -type f \
        -name "*.deb" \
        -print

      DEB_COUNT="$(
        find "${DIST_DIR}" \
          -maxdepth 1 \
          -type f \
          -name "*.deb" \
          | wc -l
      )"

      echo
      echo "Debian package count: ${DEB_COUNT}"

      if [ "${DEB_COUNT}" -eq 0 ]; then
          echo "ERROR: No Debian package was produced."
          exit 1
      fi

    displayName: Verify generated Debian package

  #
  # Stage the Debian packages for publication.
  #
  - bash: |
      set -euxo pipefail

      DIST_DIR="$(Build.SourcesDirectory)/$(BUILD_PATH)/dist"
      ARTIFACT_DIR="$(Build.ArtifactStagingDirectory)/python-deb"

      echo "========================================"
      echo "Stage Pipeline Artifact"
      echo "========================================"

      rm -rf "${ARTIFACT_DIR}"
      mkdir -p "${ARTIFACT_DIR}"

      #
      # Copy the runtime package, debug package and
      # Debian build metadata.
      #
      find "${DIST_DIR}" \
        -maxdepth 1 \
        -type f \
        \( \
          -name "*.deb" \
          -o -name "*.buildinfo" \
          -o -name "*.changes" \
        \) \
        -exec cp -v {} "${ARTIFACT_DIR}/" \;

      cd "${ARTIFACT_DIR}"

      #
      # Produce checksums for all generated Debian packages.
      #
      sha256sum ./*.deb > SHA256SUMS

      echo
      echo "========================================"
      echo "Artifact contents"
      echo "========================================"

      ls -lah

      echo
      echo "========================================"
      echo "SHA256 checksums"
      echo "========================================"

      cat SHA256SUMS

    displayName: Stage Python Debian package

  #
  # Publish the files as a downloadable Azure DevOps
  # Pipeline Artifact.
  #
  - task: PublishPipelineArtifact@1
    displayName: Publish Python Debian package

    inputs:
      targetPath: "$(Build.ArtifactStagingDirectory)/python-deb"
      artifact: "python-3.15-debian-package"
      publishLocation: "pipeline"
