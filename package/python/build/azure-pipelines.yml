trigger:
  branches:
    include:
      - main
  paths:
    include:
      - package/python/build/**

pr:
  branches:
    include:
      - main
  paths:
    include:
      - package/python/build/**

variables:
  BUILD_PATH: "package/python/build"

  PYTHON_VERSION: "3.15.2"
  PACKAGE_REVISION: "dbca1"
  PACKAGE_NAME: "python3.15-dbca"

  # Replace this with the official SHA256 checksum for:
  # Python-3.15.2.tgz
  PYTHON_SHA256: "REPLACE_WITH_PYTHON_3_15_2_SHA256"

  BUILD_IMAGE: "ghcr.io/dbca-wa/docker-apps-dev:ubuntu_2604_base_python"


pool:
  vmImage: ubuntu-latest


steps:

  #
  # Checkout repository onto the Azure build agent.
  #
  - checkout: self
    clean: true
    fetchDepth: 1


  #
  # Display the host build environment.
  #
  - bash: |
      set -euxo pipefail

      echo "Azure build agent:"
      whoami
      id

      echo
      echo "Docker:"
      docker version

      echo
      echo "Build source directory:"
      echo "$(Build.SourcesDirectory)"

    displayName: Display build environment


  #
  # Pull the DBCA Ubuntu 26.04 Python build image.
  #
  - bash: |
      set -euxo pipefail

      docker pull "$(BUILD_IMAGE)"

    displayName: Pull Python build image


  #
  # Build the Python Debian package.
  #
  # IMPORTANT:
  #
  # This intentionally does NOT use the Azure Pipelines
  # container: job functionality.
  #
  # Azure was executing our previous container job as:
  #
  #   runner_azpcontainer
  #
  # Instead, Docker is invoked directly and the build container
  # is explicitly started as UID/GID 0.
  #
  #
  # Build the Python Debian package.
  #
  # Run Docker directly rather than using an Azure container job.
  #
  - bash: |
      set -euxo pipefail

      rm -rf "$(Build.SourcesDirectory)/$(BUILD_PATH)/dist"
      mkdir -p "$(Build.SourcesDirectory)/$(BUILD_PATH)/dist"

      echo "Starting build container:"
      echo "$(BUILD_IMAGE)"

      docker run --rm \
        --user 0:0 \
        --volume "$(Build.SourcesDirectory):/workspace" \
        --workdir /workspace \
        --env PYTHON_VERSION \
        --env PACKAGE_REVISION \
        --env PYTHON_SHA256 \
        "$(BUILD_IMAGE)" \
        bash -c '
          set -euxo pipefail

          echo "========================================"
          echo "Container identity"
          echo "========================================"

          whoami
          id

          if [ "$(id -u)" -ne 0 ]; then
              echo "ERROR: Build container is not running as root."
              exit 1
          fi

          echo
          echo "========================================"
          echo "Build parameters"
          echo "========================================"

          echo "Python version: ${PYTHON_VERSION}"
          echo "Package revision: ${PACKAGE_REVISION}"

          echo
          echo "========================================"
          echo "Operating system"
          echo "========================================"

          cat /etc/os-release

          echo
          echo "========================================"
          echo "Install Debian build dependencies"
          echo "========================================"

          apt-get update

          DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            debhelper \
            devscripts \
            dpkg-dev \
            fakeroot \
            file \
            gcc \
            g++ \
            libbz2-dev \
            libdb-dev \
            libexpat1-dev \
            libffi-dev \
            libgdbm-dev \
            liblzma-dev \
            libncurses-dev \
            libreadline-dev \
            libsqlite3-dev \
            libssl-dev \
            libtirpc-dev \
            libuuid1 \
            pkg-config \
            tk-dev \
            uuid-dev \
            xz-utils \
            zlib1g-dev

          echo
          echo "========================================"
          echo "Set packaging permissions"
          echo "========================================"

          chmod 0755 \
            package/python/build/packaging/build-deb.sh \
            package/python/build/packaging/debian/rules \
            package/python/build/packaging/debian/postinst \
            package/python/build/packaging/debian/postrm

          ls -la package/python/build/packaging
          ls -la package/python/build/packaging/debian

          echo
          echo "========================================"
          echo "Verify build tools"
          echo "========================================"

          gcc --version
          g++ --version
          make --version
          dpkg-buildpackage --version
          dpkg-deb --version

          echo
          echo "========================================"
          echo "Build Python Debian package"
          echo "========================================"

          if [ "${PYTHON_SHA256}" = "REPLACE_WITH_PYTHON_3_15_2_SHA256" ]; then
              echo "ERROR: PYTHON_SHA256 has not been configured."
              exit 1
          fi

          package/python/build/packaging/build-deb.sh \
            "${PYTHON_VERSION}" \
            "${PACKAGE_REVISION}" \
            "${PYTHON_SHA256}"

          echo
          echo "========================================"
          echo "Generated files"
          echo "========================================"

          find package/python/build/dist \
            -maxdepth 1 \
            -type f \
            -exec ls -lh {} \;

          echo
          echo "========================================"
          echo "Build completed"
          echo "========================================"
        '

    displayName: Compile Python and build Debian package
    env:
      PYTHON_VERSION: $(PYTHON_VERSION)
      PACKAGE_REVISION: $(PACKAGE_REVISION)
      PYTHON_SHA256: $(PYTHON_SHA256)
